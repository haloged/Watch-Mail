# ============================================================================
# Gradle 全局配置
# ============================================================================

# 构建 JVM 内存：表盘应用体积小，3GB 足够且不会挤占开发机内存
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# 并行构建与构建缓存，缩短二次构建时间
org.gradle.parallel=true
org.gradle.caching=true

# 关闭原生文件系统监视：在受限/容器化环境下该原生线程可能无法启动，
# 关闭后可稳定完成增量构建（代价是每次构建重新扫描输入）
org.gradle.vfs.watch=false

# AndroidX 与 R 类非传递化（减少方法数、加快编译）
android.useAndroidX=true
android.nonTransitiveRClass=true

# ----------------------------------------------------------------------------
# R8 优化（release 构建）
# ----------------------------------------------------------------------------
# release 已启用：isMinifyEnabled + isShrinkResources，默认规则为
# proguard-android-optimize.txt（含 -allowaccessmodification 等优化开关）。
# AGP 8 起 R8 全量模式（full mode）默认开启，这里显式声明以固定行为、便于审计。
# 验证方式：assembleRelease 后检查 app/build/outputs/mapping/release/
#   - mapping.txt 首行 "# compiler: R8" 即代码已经 R8 处理；
#   - configuration.txt 可见实际生效的规则来源（含 optimize 版默认文件）。
android.enableR8.fullMode=true

kotlin.code.style=official

# 说明：本项目要求 JDK 17（AGP 8.7 最低要求）。
# 若开发机未设置 JAVA_HOME，可取消下面一行的注释并改成自己的 JDK 路径：
# org.gradle.java.home=C:/Program Files/Java/jdk-17

# ============================================================================
# 可选：Microsoft (Outlook / Office 365) OAuth2 客户端 ID
# ----------------------------------------------------------------------------
# Outlook 已停用 IMAP/SMTP 基础认证，必须用 OAuth2。客户端 ID 需要你在 Azure 门户
# 自行注册应用获得（应用注册 → 新注册 → 账户类型含个人账户 → 身份验证里启用
# 「允许公共客户端流」；设备码流不需要客户端密码），然后把 Application (client) ID
# 填在下面，或直接在手表的「设置 → Outlook OAuth2」里填写（后者优先级更高，无需重新打包）。
wearmail.microsoftOAuthClientId=

# 反馈表（维格表）上传令牌：仅本地构建使用；公开仓库（D:/Watch-Mail）中该值为空
wearmail.vikaToken=
