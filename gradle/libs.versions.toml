# ============================================================================
# 版本目录（Version Catalog）
# 说明：所有版本均经过实际依赖解析验证可用，升级前请确认兼容性矩阵。
#   - Compose 1.8.2 是 wear-compose-material3 1.5.6 所声明的编译基线
#   - compileSdk 35 为 Compose 1.8.x / core-ktx 1.15 / activity 1.10 的最低要求
# ============================================================================

[versions]
agp = "8.7.3"                     # Android Gradle Plugin
kotlin = "2.1.0"                  # Kotlin + Compose 编译器插件同版本
coreKtx = "1.15.0"
activityCompose = "1.10.1"
lifecycle = "2.8.7"
compose = "1.8.2"                 # androidx.compose.* 统一版本
materialIconsCore = "1.7.7"       # 仅使用 core 图标集（extended 体积过大）
wearCompose = "1.5.6"             # androidx.wear.compose:compose-material3
work = "2.9.0"                    # WorkManager：后台同步
coroutines = "1.9.0"
javamail = "1.6.7"                # JavaMail Android 版：IMAP / SMTP
zxing = "3.5.3"                   # 二维码生成（手机扫码配置邮箱）
junit = "4.13.2"
orgJson = "20240303"

[libraries]
# ---- AndroidX 基础 ----
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# ---- Compose 基础（手表端只用 Compose，不用 View 体系）----
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "materialIconsCore" }

# ---- Wear OS Material3 ----
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-compose-ui-tooling = { module = "androidx.wear.compose:compose-ui-tooling", version.ref = "wearCompose" }

# ---- 邮件协议 / 二维码 / 协程 ----
javamail-android-mail = { module = "com.sun.mail:android-mail", version.ref = "javamail" }
javamail-android-activation = { module = "com.sun.mail:android-activation", version.ref = "javamail" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# ---- 测试 ----
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# 仅供单元测试：Android 平台的 org.json 在 JVM 单测里是桩实现
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
